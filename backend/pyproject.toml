[project]
name = "financehub"
version = "0.1.0"
description = "Self-hosted personal finance app"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "python-multipart==0.0.17",

    # Templates
    "jinja2==3.1.*",

    # HTTP client (GoCardless API)
    "httpx==0.28.*",

    # Database
    # NOTE: the data layer is fully synchronous (sqlcipher3 has no async driver),
    # so aiosqlite is deliberately absent — it was declared but never imported.
    "sqlalchemy==2.0.*",
    "sqlcipher3==0.5.*",
    "alembic==1.14.*",

    # Authentication
    # itsdangerous is deliberately absent: sessions are DB-backed opaque tokens
    # (app/security/session.py), and Starlette's SessionMiddleware is never used.
    "webauthn==2.2.*",
    "pyotp==2.9.*",
    "qrcode==8.0.*",

    # Cryptography (AES-GCM for token storage)
    "cryptography==44.*",

    # Secrets (parse SOPS-decrypted YAML)
    "pyyaml==6.0.*",

    # Scheduling (nightly sync)
    "apscheduler==3.10.*",

    # NOTE: no ML dependencies. ARCHITECTURE.md section 5 specifies a scikit-learn
    # "Layer 2" categorization fallback, but it was never implemented —
    # services/categorizer.py is rules-only. scikit-learn and joblib were declared
    # but never imported, pulling ~100 MB of numpy/scipy into the image for nothing.
    # Re-add them in the same commit that actually implements the ML layer.

    # Validation
    "pydantic==2.10.*",
    "pydantic-settings==2.7.*",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.*",
    "pytest-asyncio==0.24.*",
    "httpx==0.28.*",
    "respx==0.21.*",
    "bandit==1.8.*",
    "ruff==0.8.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B"]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # `Depends(...)` in a default argument is the FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately contain obvious fake credentials ("rpw", "a"*64).
# Flagging them buries the real findings; the security rules still apply to app/.
"../tests/**" = ["S105", "S106", "S603", "S607"]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
