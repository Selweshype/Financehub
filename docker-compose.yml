networks:
  frontend:
    driver: bridge
    internal: false   # caddy needs internet for ACME/Let's Encrypt
  backend:
    driver: bridge
    internal: true    # no direct internet access from app

volumes:
  db_data:
  caddy_data:
  caddy_config:
  ml_models:
  restic_cache:

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend          # backend-only: caddy is the sole ingress boundary
    # Container hardening (finding M3)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - db_data:/data
      - ml_models:/models
      - /etc/financehub/age-key.txt:/secrets/age-key.txt:ro
      - ./secrets/secrets.enc.yaml:/secrets/secrets.enc.yaml:ro
    expose:
      - "8000"
    environment:
      - SOPS_AGE_KEY_FILE=/secrets/age-key.txt
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      # Caddy is the sole ingress on an internal network, so X-Forwarded-For
      # cannot be spoofed by a client — let the rate limiter use it.
      - FINANCEHUB_TRUST_PROXY=1
      # WebAuthn RP ID and origin. Deriving these from the Host header would
      # let an attacker steer the ceremony, so they are pinned here.
      # Replace with your real domain before deploying.
      - FINANCEHUB_RP_ID=financehub.example.com
      - FINANCEHUB_ORIGIN=https://financehub.example.com
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/liveness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    networks:
      - frontend         # accepts external traffic
      - backend          # reaches app on the backend network
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backup:
    build:
      context: ./infra/restic
      dockerfile: Dockerfile
    restart: "no"
    # One-shot job, never part of `docker compose up`. Without this it starts on
    # every `up` and — because its age-key and secrets.enc.yaml bind mounts do not
    # exist on a dev machine — Docker creates DIRECTORIES at those host paths.
    # `docker compose run --rm backup` (what `make backup` does) still works:
    # `run` enables the service's profile implicitly.
    profiles: ["backup"]
    networks: []
    volumes:
      - db_data:/data:ro
      - restic_cache:/root/.cache/restic
      - /etc/financehub/age-key.txt:/secrets/age-key.txt:ro
      - ./secrets/secrets.enc.yaml:/secrets/secrets.enc.yaml:ro
    environment:
      - SOPS_AGE_KEY_FILE=/secrets/age-key.txt
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
